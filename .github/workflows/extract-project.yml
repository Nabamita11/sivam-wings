name: Extract Sivam Wings project

on:
  push:
    paths:
      - "Sivam_Wings_Project_Logo_Fixed.zip"
      - ".github/workflows/extract-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project files safely
        shell: bash
        run: |
          set -euo pipefail
          unzip -q Sivam_Wings_Project_Logo_Fixed.zip -d /tmp/sivam-zip
          SRC="/tmp/sivam-zip/FutureJobs_WhatsApp_FutureJobs_Fixed/sss_edit"
          test -f "$SRC/package.json"
          rsync -a --delete             --exclude='.env'             --exclude='.aistudio/'             --exclude='.git/'             "$SRC/" ./
          rm -f Sivam_Wings_Project_Logo_Fixed.zip
          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          .env
          .env.*
          !.env.example
          .aistudio/
          EOF

      - name: Commit extracted project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
          else
            git commit -m "Extract Sivam Wings project files"
            git push
          fi
